name: fetch-meeting-inputs
on:
  push:
    branches: [raw-inputs]
    paths: [requests.csv]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install qpdf
        run: sudo apt-get install -y -q qpdf
      - name: Download agendas, packets, minutes
        run: |
          tail -n +2 requests.csv | while IFS=, read -r date type event agenda packet minutes video; do
            d="inputs/$date-$type"; mkdir -p "$d"
            for pair in "agenda:$agenda" "packet:$packet" "minutes:$minutes"; do
              name=${pair%%:*}; id=${pair##*:}
              [ -z "$id" ] && continue
              curl -sSfL --retry 3 -o "$d/$name.pdf" "https://kalamazoomi.api.civicclerk.com/v1/Meetings/GetMeetingFileStream(fileId=$id,plainText=false)" || echo "FAILED $name" >> "$d/log.txt"
            done
            find "$d" -name '*.pdf' -size +95M | while read -r big; do
              mb=$(du -m "$big" | cut -f1); n=$(qpdf --show-npages "$big"); k=$(( mb / 80 + 1 )); per=$(( (n + k - 1) / k )); s=1; i=1
              while [ $s -le $n ]; do e=$(( s + per - 1 )); [ $e -gt $n ] && e=$n; qpdf --warning-exit-0 "$big" --pages . $s-$e -- "${big%.pdf}-part$i-pages-$s-$e.pdf"; s=$(( e + 1 )); i=$(( i + 1 )); done
              echo "SPLIT $(basename "$big") ($mb MB, $n pages) into $k parts" >> "$d/log.txt"; rm "$big"
              find "$d" -name '*-part*.pdf' -size +95M | while read -r p2; do echo "PART STILL TOO BIG $(basename "$p2")" >> "$d/log.txt"; rm "$p2"; done
            done
          done
      - name: Save to branch
        run: |
          git config user.name "fetch-bot"; git config user.email "fetch-bot@users.noreply.github.com"
          git add inputs; git commit -qm "Fetched inputs" || echo nothing; git pull --rebase -q; git push
